global:
  resolve_timeout: 5m
  slack_api_url_file: '/tmp/slack_webhook_url'

route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  receiver: 'slack-notifications'

receivers:
  - name: 'slack-notifications'
    slack_configs:
      - channel: '#quiz-alerts'
        username: 'Quiz Monitoring'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥 [CẢNH BÁO SỰ CỐ - {{ .CommonLabels.severity | toUpper }}]{{ else }}✅ [ĐÃ KHẮC PHỤC]{{ end }} {{ .CommonLabels.alertname }}'
        color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'
        text: >-
          {{ range .Alerts }}
            *Tên cảnh báo:* {{ .Labels.alertname }}
            *Mức độ:* `{{ .Labels.severity }}`
            *Tóm tắt:* {{ .Annotations.summary }}
            *Chi tiết:* {{ .Annotations.description }}
            *Thời gian:* {{ .StartsAt.Format "15:04:05 02/01/2006" }}
          {{ end }}
