    #     chat_id: 123456789                  # Điền Chat ID số từ @userinfobot (hoặc ID group -xxxxxxxxx)
    #     send_resolved: true                 # Tự động gửi tin nhắn báo khi sự cố đã được giải quyết
    #     parse_mode: 'HTML'
    #     message: |
    #       {{ if eq .Status "firing" }}🔥 <b>[CẢNH BÁO SỰ CỐ]</b>{{ else }}✅ <b>[ĐÃ KHẮC PHỤC]</b>{{ end }}
    #       <b>Tên cảnh báo:</b> {{ .CommonLabels.alertname }}
    #       <b>Mức độ:</b> {{ .CommonLabels.severity }}
    #       <b>Tóm tắt:</b> {{ .CommonAnnotations.summary }}
