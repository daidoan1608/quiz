groups:
  - name: QuizBackendAlerts
    rules:
      - alert: BackendDown
        expr: up{job="spring-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend Down (Dịch vụ Backend không phản hồi)"
          description: "Backend service không phản hồi trong hơn 1 phút tại instance {{ $labels.instance }}."

      - alert: HighCpuUsage
        expr: process_cpu_usage{job="spring-backend"} * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU Usage (CPU Backend > 85%)"
          description: "Process CPU đang ở mức {{ $value | printf \"%.1f\" }}% liên tục trong 2 phút."

      - alert: HighJvmHeapUsage
        expr: (sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"})) * 100 > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High JVM Heap Usage (Bộ nhớ Heap > 90%)"
          description: "Bộ nhớ JVM Heap đã vượt quá 90% (hiện tại: {{ $value | printf \"%.1f\" }}%), nguy cơ gặp OutOfMemoryError."

      - alert: HighHttp5xxRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m])) > 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx Rate (Tỷ lệ lỗi 5xx tăng cao)"
          description: "Hệ thống đang phát sinh nhiều lỗi 5xx (> 1 req/s) trong 1 phút qua."

      - alert: DatabaseConnectionPoolDepleted
        expr: hikaricp_connections_pending > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Database Connection Pool Depleted (Hết kết nối DB)"
          description: "Đang có hơn 5 request chờ kết nối database trống trong connection pool."

      - alert: RedisDown
        expr: redis_up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis Down (Dịch vụ Redis không phản hồi)"
          description: "Dịch vụ Redis không phản hồi trong hơn 1 phút."

      - alert: RedisHighMemoryUsage
        expr: (redis_memory_max_bytes{job="redis"} > 0) and ((redis_memory_used_bytes{job="redis"} / redis_memory_max_bytes{job="redis"}) * 100 > 90)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis High Memory Usage (Bộ nhớ Redis > 90%)"
          description: "Redis đang sử dụng hơn 90% dung lượng bộ nhớ tối đa."

      - alert: RabbitMQDown
        expr: rabbitmq_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ Down (Dịch vụ RabbitMQ không phản hồi)"
          description: "Dịch vụ hàng đợi tin nhắn RabbitMQ không phản hồi trong hơn 1 phút."


