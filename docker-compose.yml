services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/daidoan1608/quiz-backend:production}
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env.production
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx768m -XX:+UseG1GC}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:${DB_PORT:-3306}/${DB_NAME:-quiz}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Ho_Chi_Minh
    expose:
      - "${SERVER_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  user:
    image: ${CLIENT_IMAGE:-ghcr.io/daidoan1608/quiz-client:production}
    build:
      context: ./client
      args:
        VITE_API_URL: ${CLIENT_API_URL:-https://api.quizvnua.com/api/v1/}
        VITE_AVATAR_URL: ${CLIENT_AVATAR_URL:-https://api.quizvnua.com}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-995894234177-1b4ri2jqtthfkpilgchdrv39c50mpn5o.apps.googleusercontent.com}
    restart: unless-stopped
    env_file:
      - ./server/.env.production
    expose:
      - "${CLIENT_PORT:-3000}"

  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/daidoan1608/quiz-admin:production}
    build:
      context: ./admin
      args:
        VITE_API_URL: ${ADMIN_API_URL:-https://api.quizvnua.com/api/v1/}
        VITE_ADMIN_BASENAME: ${ADMIN_BASENAME:-/}
    restart: unless-stopped
    env_file:
      - ./server/.env.production
    expose:
      - "${ADMIN_PORT:-3001}"

  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=100
    env_file:
      - ./server/.env.production
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: ${DB_NAME:-quiz}
    expose:
      - "${DB_PORT:-3306}"
    volumes:
      - ./mysql.init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    expose:
      - "${REDIS_PORT:-6379}"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    expose:
      - "${RABBITMQ_PORT:-5672}"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}"
    env_file:
      - ./server/.env.production
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./monitoring/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_started
      user:
        condition: service_started
      admin:
        condition: service_started

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    expose:
      - "${PROMETHEUS_PORT:-9090}"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    expose:
      - "3000"
    env_file:
      - ./server/.env.production
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_AUTO_ASSIGN_ORG=true
      - GF_USERS_AUTO_ASSIGN_ORG_NAME=${GRAFANA_ORG_NAME:-Quiz VNUA}
      - GF_BRANDING_APP_TITLE=${GRAFANA_APP_TITLE:-Quiz VNUA - Giám Sát Hệ Thống}
      - GF_BRANDING_APP_SUB_TITLE=${GRAFANA_APP_SUB_TITLE:-Hệ thống giám sát và cảnh báo sự cố Quiz VNUA}
      - GF_SERVER_INSTANCE_NAME=${GRAFANA_INSTANCE_NAME:-Quiz VNUA Monitor}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    expose:
      - "${ALERTMANAGER_PORT:-9093}"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.1.0
    restart: unless-stopped
    expose:
      - "${LOKI_PORT:-3100}"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    profiles: ["monitoring"]
    image: grafana/promtail:3.1.0
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_started

  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.67.0-alpine
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:${REDIS_PORT:-6379}
    expose:
      - "${REDIS_EXPORTER_PORT:-9121}"
    depends_on:
      - redis

volumes:
  db-data:
  redis-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
  rabbitmq-data:
