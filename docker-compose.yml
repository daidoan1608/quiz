services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required in .env}
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${SERVER_PORT:?SERVER_PORT is required in .env}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  user:
    image: ${CLIENT_IMAGE:?CLIENT_IMAGE is required in .env}
    build:
      context: ./client
      args:
        VITE_API_URL: ${CLIENT_API_URL:?CLIENT_API_URL is required in .env}
        VITE_AVATAR_URL: ${CLIENT_AVATAR_URL}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required in .env}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${CLIENT_PORT:?CLIENT_PORT is required in .env}"

  admin:
    image: ${ADMIN_IMAGE:?ADMIN_IMAGE is required in .env}
    build:
      context: ./admin
      args:
        VITE_API_URL: ${ADMIN_API_URL:?ADMIN_API_URL is required in .env}
        VITE_ADMIN_BASENAME: ${ADMIN_BASENAME:?ADMIN_BASENAME is required in .env}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${ADMIN_PORT:?ADMIN_PORT is required in .env}"

  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:?MYSQL_INNODB_BUFFER_POOL_SIZE is required in .env}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:?MYSQL_MAX_CONNECTIONS is required in .env}
    env_file:
      - .env
    expose:
      - "${DB_PORT:?DB_PORT is required in .env}"
    volumes:
      - ./mysql.init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    env_file:
      - .env
    expose:
      - "${REDIS_PORT:?REDIS_PORT is required in .env}"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    expose:
      - "${RABBITMQ_PORT:?RABBITMQ_PORT is required in .env}"
      - "${RABBITMQ_MANAGEMENT_PORT:?RABBITMQ_MANAGEMENT_PORT is required in .env}"
    env_file:
      - .env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./monitoring/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${NGINX_PORT:?NGINX_PORT is required in .env}:80"
      - "${NGINX_HTTPS_PORT:?NGINX_HTTPS_PORT is required in .env}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_started
      user:
        condition: service_started
      admin:
        condition: service_started

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${PROMETHEUS_PORT:?PROMETHEUS_PORT is required in .env}"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    expose:
      - "${GRAFANA_PORT:?GRAFANA_PORT is required in .env}"
    env_file:
      - .env
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${ALERTMANAGER_PORT:?ALERTMANAGER_PORT is required in .env}"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.1.0
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${LOKI_PORT:?LOKI_PORT is required in .env}"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    profiles: ["monitoring"]
    image: grafana/promtail:3.1.0
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_started

  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.67.0-alpine
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${REDIS_EXPORTER_PORT:?REDIS_EXPORTER_PORT is required in .env}"
    depends_on:
      - redis

volumes:
  db-data:
  redis-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
  rabbitmq-data:
