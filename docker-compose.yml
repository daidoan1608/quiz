services:
  backend:
    build: ./server
    restart: always
    expose:
      - "8080"
    depends_on:
      - db
      - redis
    env_file:
      - ./server/.env.production
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis

  user:
    build:
      context: ./client
      args:
        REACT_APP_API_URL: ${CLIENT_API_URL:-https://api.quizvnua.com/api/v1/}
        REACT_APP_AVATAR_URL: ${CLIENT_AVATAR_URL:-https://api.quizvnua.com}
        REACT_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: always
    expose:
      - "3000"

  admin:
    build:
      context: ./admin
      args:
        REACT_APP_API_URL: ${ADMIN_API_URL:-https://api.quizvnua.com/api/v1/}
        REACT_APP_ADMIN_BASENAME: ${ADMIN_BASENAME:-/}
    restart: always
    expose:
      - "3001"

  db:
    image: mysql:8.0
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file:
      - ./server/.env.production
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-quiz}
    volumes:
      - ./mysql.init:/docker-entrypoint-initdb.d
      - db-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - user
      - admin

volumes:
  db-data:
  redis-data:
