spring.datasource.url=jdbc:h2:mem:quiz_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.cache.type=none
spring.data.redis.repositories.enabled=false

jwt.secret=test-secret-key-must-be-at-least-32-bytes-long

app.cors.allowed-origins=http://localhost:3000,http://localhost:3001
app.cookie.domain=
app.cookie.secure=false
app.cookie.same-site=Strict
app.security.csrf-enabled=true
spring.flyway.enabled=false
app.admin.initializer-enabled=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
