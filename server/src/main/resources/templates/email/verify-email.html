<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác thực email tài khoản Quiz VNUA</title>
</head>
<body style="margin:0;padding:0;background:#e9eef6;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#191c1e;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#e9eef6;padding:32px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#f6f9fd;border:1px solid #d5deeb;border-radius:24px;padding:1px;box-shadow:0 24px 34px -12px rgba(15,23,42,0.18);">
                <tr>
                    <td style="border-radius:23px;background:#ffffff;padding:32px;">
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                            <tr>
                                <td style="padding-bottom:24px;">
                                    <span style="display:inline-block;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#2170e4 0%,#0058be 100%);color:#ffffff;text-align:center;font-size:22px;line-height:44px;font-weight:800;">Q</span>
                                    <span style="display:inline-block;margin-left:12px;color:#191c1e;font-size:18px;font-weight:800;vertical-align:13px;">Quiz VNUA</span>
                                </td>
                            </tr>
                        </table>
                        <h1 style="margin:0 0 10px;font-size:26px;line-height:1.25;color:#191c1e;font-weight:800;">Xác thực email</h1>
                        <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#424754;">Xin chào {{name}},</p>
                        <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#424754;">Vui lòng nhấn vào nút bên dưới để xác thực email tài khoản Quiz VNUA của bạn.</p>
                        <p style="margin:0 0 24px;">
                            <a href="{{verifyUrl}}" style="display:inline-block;background:#0058be;color:#ffffff;text-decoration:none;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:700;box-shadow:0 10px 20px rgba(0,88,190,0.20);">Xác thực email</a>
                        </p>
                        <p style="margin:0 0 12px;font-size:14px;line-height:1.6;color:#64748b;">Liên kết có hiệu lực trong {{expirationMinutes}} phút.</p>
                        <p style="margin:0;font-size:14px;line-height:1.6;color:#64748b;">Nếu bạn không đăng ký tài khoản, vui lòng bỏ qua email này.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
