<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mã OTP đặt lại mật khẩu</title>
</head>
<body style="margin:0;padding:0;background:#e9eef6;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#191c1e;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#e9eef6;padding:32px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#f6f9fd;border:1px solid #d5deeb;border-radius:24px;padding:1px;box-shadow:0 24px 34px -12px rgba(15,23,42,0.18);">
                <tr>
                    <td style="border-radius:23px;background:#ffffff;padding:32px;">
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                            <tr>
                                <td style="padding-bottom:24px;">
                                    <span style="display:inline-block;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#2170e4 0%,#0058be 100%);color:#ffffff;text-align:center;font-size:22px;line-height:44px;font-weight:800;">Q</span>
                                    <span style="display:inline-block;margin-left:12px;color:#191c1e;font-size:18px;font-weight:800;vertical-align:13px;">Quiz VNUA</span>
                                </td>
                            </tr>
                        </table>
                        <h1 style="margin:0 0 10px;font-size:26px;line-height:1.25;color:#191c1e;font-weight:800;">Mã OTP đặt lại mật khẩu</h1>
                        <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#424754;">Nhập mã bên dưới để tiếp tục đặt lại mật khẩu tài khoản của bạn.</p>
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 24px;">
                            <tr>
                                <td align="center" style="border:1px solid #d5deeb;border-radius:18px;background:#f6f9fd;padding:22px 12px;">
                                    <span style="display:inline-block;color:#0058be;font-size:34px;line-height:1.2;font-weight:800;letter-spacing:8px;">{{otp}}</span>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:0 0 12px;font-size:14px;line-height:1.6;color:#64748b;">Mã OTP này có hiệu lực trong 5 phút.</p>
                        <p style="margin:0;font-size:14px;line-height:1.6;color:#64748b;">Nếu bạn không yêu cầu đặt lại mật khẩu, vui lòng bỏ qua email này.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
