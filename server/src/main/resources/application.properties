spring.application.name=${SPRING_APPLICATION_NAME}
server.port=${SERVER_PORT}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER}

spring.cache.type=${SPRING_CACHE_TYPE}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=${REDIS_TIMEOUT}
spring.data.redis.repositories.enabled=${REDIS_REPOSITORIES_ENABLED}
app.cache.redis.key-prefix=${REDIS_KEY_PREFIX}

avatar.upload-dir=${AVATAR_UPLOAD_DIR}
question.upload-dir=${QUESTION_UPLOAD_DIR}
document.upload-dir=${DOCUMENT_UPLOAD_DIR}
avatar.default-url=${AVATAR_DEFAULT_URL}

cloudinary.enabled=${CLOUDINARY_ENABLED}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER}
imgbb.enabled=${IMGBB_ENABLED}
imgbb.api-key=${IMGBB_API_KEY}
image.storage.primary=${IMAGE_STORAGE_PRIMARY}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE}

spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}

app.frontend.base-url=${APP_FRONTEND_BASE_URL}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.cookie.domain=${APP_COOKIE_DOMAIN:}
app.cookie.secure=${APP_COOKIE_SECURE}
app.cookie.same-site=${APP_COOKIE_SAME_SITE}
app.cookie.max-age=${APP_COOKIE_MAX_AGE}
app.email-verification.expiration-minutes=${EMAIL_VERIFICATION_EXPIRATION_MINUTES}

springdoc.api-docs.enabled=${SWAGGER_API_DOCS_ENABLED}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH}
springdoc.api-docs.path=${SWAGGER_API_DOCS_PATH}

google.client.id=${GOOGLE_CLIENT_ID}
google.jwks-url=${GOOGLE_JWKS_URL}

app.admin.initializer-enabled=${ADMIN_INITIALIZER_ENABLED}
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.admin.email=${ADMIN_EMAIL}
app.admin.full-name=${ADMIN_FULL_NAME}

app.security.csrf-enabled=${APP_SECURITY_CSRF_ENABLED}
