spring.application.name=${SPRING_APPLICATION_NAME:quiz}
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:quiz}}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

avatar.upload-dir=${AVATAR_UPLOAD_DIR:uploads/avatars}
question.upload-dir=${QUESTION_UPLOAD_DIR:uploads/questions}
avatar.default-url=${AVATAR_DEFAULT_URL:/avatars/default.png}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:5MB}

spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:example@gmail.com}
spring.mail.password=${MAIL_PASSWORD:change-me-in-env}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}

springdoc.api-docs.enabled=${SWAGGER_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui}
springdoc.api-docs.path=${SWAGGER_API_DOCS_PATH:/v3/api-docs}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

google.client.id=${GOOGLE_CLIENT_ID:change-me-in-env}

app.admin.initializer-enabled=${ADMIN_INITIALIZER_ENABLED:false}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.full-name=${ADMIN_FULL_NAME:Quản trị viên Hệ thống}

app.security.csrf-enabled=${APP_SECURITY_CSRF_ENABLED:true}
