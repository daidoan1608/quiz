# ==========================================
# C\u1EA4U H\u00CCNH CHO M\u00D4I TR\u01AF\u1EDCNG PROD (VPS)
# ==========================================
# 1. CORS: Ch\u1EC9 cho ph\u00E9p c\u00E1c domain th\u1EADt c\u1EE7a b\u1EA1n
app.cors.allowed-origins=https://quizvnua.com,https://www.quizvnua.com,https://admin.quizvnua.com
# 2. COOKIE:
# QUAN TR\u1ECCNG: C\u00F3 d\u1EA5u ch\u1EA5m \u1EDF \u0111\u1EA7u \u0111\u1EC3 chia s\u1EBB cookie gi\u1EEFa user v\u00E0 admin
app.cookie.domain=.quizvnua.com
# Secure = true b\u1EAFt bu\u1ED9c v\u00EC VPS ch\u1EA1y HTTPS
app.cookie.secure=true
# SameSite = None (ho\u1EB7c Lax) \u0111\u1EC3 t\u01B0\u01A1ng th\u00EDch t\u1ED1t nh\u1EA5t v\u1EDBi subdomain
app.cookie.same-site=None
app.cookie.max-age=86400
# 3. DATABASE (T\u00F9y ch\u1ECDn)
# N\u1EBFu tr\u00EAn VPS b\u1EA1n \u0111\u1EB7t m\u1EADt kh\u1EA9u DB kh\u00E1c, h\u00E3y b\u1ECF comment v\u00E0 s\u1EEDa \u1EDF \u0111\u00E2y
