# ==========================================
# C\u1EA4U H\u00CCNH CHO M\u00D4I TR\u01AF\u1EDCNG DEV (LOCALHOST)
# ==========================================
# 1. CORS: Cho ph\u00E9p Frontend ch\u1EA1y \u1EDF port 3000 ho\u1EB7c 3001 g\u1ECDi v\u00E0o
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001
# 2. COOKIE:
# Domain \u0111\u1EC3 tr\u1ED1ng => m\u1EB7c \u0111\u1ECBnh l\u00E0 localhost
app.cookie.domain=
# Secure = false v\u00EC ch\u1EA1y http
app.cookie.secure=false
# SameSite = Strict ch\u1EA1y t\u1ED1t tr\u00EAn localhost
app.cookie.same-site=Strict
# Max age: 1 ng\u00E0y
app.cookie.max-age=86400